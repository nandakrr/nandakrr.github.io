<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ProdSec Interview Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: a study app. Left rail groups modules by verb (Plan, Learn, Do, Recall, Tell); the main pane is a workbench. Same four pillar hues as the Atlas, used for domains; indigo for app chrome; green/amber/red only for feedback. */
:root{
  --bg:#f3f4f8; --card:#ffffff; --ink:#191c26; --muted:#5d6273; --line:#d7dae3; --soft:#eceef4; --code:#f6f7fa;
  --acc:#3b45c9; --acc-s:#e6e8fb;
  --pf:#4a4ec2; --pf-s:#e7e8fa; --pb:#0d8577; --pb-s:#ddf2ee; --pr:#b56f0c; --pr-s:#fbefdc; --pp:#923c86; --pp-s:#f6e4f2;
  --ok:#1d8048; --ok-s:#def3e6; --warn:#b85c00; --warn-s:#fdeedc; --bad:#c42b2b; --bad-s:#fbe2e2;
  --z-ext:#f6efe6; --z-edge:#e5eefb; --z-id:#ece8f8; --z-svc:#ffffff; --z-data:#e7f3ee; --z-base:#eef1f4; --grid:#e3e6ee;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1118; --card:#161922; --ink:#e6e8ef; --muted:#9aa0b2; --line:#2b2f3c; --soft:#1e212c; --code:#11141c;
  --acc:#9aa3ff; --acc-s:#23284d;
  --pf:#9a9dff; --pf-s:#242650; --pb:#4fd1bf; --pb-s:#123530; --pr:#f2b24c; --pr-s:#3a2a10; --pp:#e58ad6; --pp-s:#3a1d36;
  --ok:#5dd08f; --ok-s:#143523; --warn:#f5a34f; --warn-s:#3a2610; --bad:#ff7a7a; --bad-s:#3d1a1a;
  --z-ext:#2a241c; --z-edge:#18263b; --z-id:#221e36; --z-svc:#18202b; --z-data:#152a22; --z-base:#18202b; --grid:#1b1f2a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1118; --card:#161922; --ink:#e6e8ef; --muted:#9aa0b2; --line:#2b2f3c; --soft:#1e212c; --code:#11141c;
  --acc:#9aa3ff; --acc-s:#23284d;
  --pf:#9a9dff; --pf-s:#242650; --pb:#4fd1bf; --pb-s:#123530; --pr:#f2b24c; --pr-s:#3a2a10; --pp:#e58ad6; --pp-s:#3a1d36;
  --ok:#5dd08f; --ok-s:#143523; --warn:#f5a34f; --warn-s:#3a2610; --bad:#ff7a7a; --bad-s:#3d1a1a;
  --z-ext:#2a241c; --z-edge:#18263b; --z-id:#221e36; --z-svc:#18202b; --z-data:#152a22; --z-base:#18202b; --grid:#1b1f2a;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);margin:0;padding-inline:0}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:clamp(32px,4.6vw,54px);font-weight:800;line-height:1}
h2{font-size:clamp(24px,2.8vw,32px);font-weight:750;line-height:1.12}
h3{font-size:19px;font-weight:700;line-height:1.2}
h4{font-size:15px;font-weight:700}
p{margin:0} ul,ol{margin:0}
a{color:var(--acc)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.small{font-size:14px}

/* shell */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 10px;display:flex;align-items:center;gap:16px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:800 18px var(--f-display);white-space:nowrap}
.brand span{font:12px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{display:flex;align-items:center;gap:10px;font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.meter .bar{width:120px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 54px)}
nav.rail{border-right:1px solid var(--line);background:var(--card);padding:18px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
.grp{display:grid;gap:3px}
.grp .eyebrow{padding:0 10px 6px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:8px;font-size:15px}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--acc-s);color:var(--acc);font-weight:700}
.nav .ct{font:11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
main{padding-inline:28px;padding-block:28px 80px;min-width:0}
.view{max-width:1180px;margin:0 auto;display:grid;gap:28px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.rail{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;gap:6px}
  .grp{display:flex;gap:4px}
  .grp .eyebrow{display:none}
  .nav{white-space:nowrap;padding:7px 11px;font-size:14px}
  .nav .ct{display:none}
  main{padding-inline:16px}
  .meter .bar{width:70px}
  .brand span{display:none}
}

/* shared bits */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.head{display:grid;gap:8px;max-width:76ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14.5px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--card)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-block;font:12px var(--f-mono);padding:3px 8px;border-radius:5px;background:var(--soft);color:var(--ink)}
.tag{display:inline-block;font:600 11px var(--f-mono);padding:3px 7px;border-radius:5px;letter-spacing:.03em}
.tag.ok{background:var(--ok-s);color:var(--ok)} .tag.warn{background:var(--warn-s);color:var(--warn)} .tag.bad{background:var(--bad-s);color:var(--bad)} .tag.acc{background:var(--acc-s);color:var(--acc)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--acc)}
.say{border-left:3px solid var(--acc);padding:3px 0 3px 12px;font-weight:600}
.list{padding-left:19px;display:grid;gap:5px}
.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:1fr}}
.picker{display:grid;gap:6px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
@media (max-width:980px){.picker{position:static;max-height:none;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);overflow-x:auto}}
.pick{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;cursor:pointer}
.pick:hover{border-color:var(--acc)}
.pick.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.pick .t{font-weight:700;font-size:14.5px;line-height:1.25}
.pick .m{display:flex;justify-content:space-between;gap:6px;align-items:center;font:12px var(--f-mono);color:var(--muted)}
details.fold{background:var(--card);border:1px solid var(--line);border-radius:12px}
details.fold>summary{cursor:pointer;padding:16px 18px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h3{font-size:18px}
details.fold>summary::after{content:"+";font:600 20px var(--f-mono);color:var(--muted)}
details.fold[open]>summary::after{content:"−"}
details.fold>.inner{padding:0 18px 18px;display:grid;gap:14px;min-width:0}
textarea,input[type=text],input[type=search],select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:110px;resize:vertical;line-height:1.45}
textarea.codebox{font:13px/1.5 var(--f-mono);min-height:230px;tab-size:2;background:var(--code);white-space:pre}
pre.blk{margin:0;font:12.8px/1.55 var(--f-mono);background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;white-space:pre}
.tablebox{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14.5px}
th,td{text-align:left;vertical-align:top;padding:11px 13px;border-bottom:1px solid var(--line)}
thead th{font:600 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
tbody tr:last-child td{border-bottom:0}
.stride{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font:700 11.5px var(--f-mono);background:var(--pr-s);color:var(--pr)}
.fb{border-radius:10px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-s)} .fb.warn{background:var(--warn-s)} .fb.bad{background:var(--bad-s)}
.fb b{display:block;margin-bottom:3px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:end}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.loop4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:600px){.loop4{grid-template-columns:repeat(2,1fr)}}
.loop4 div{border-radius:10px;padding:12px;display:grid;gap:4px;background:var(--card);border:1px solid var(--line)}
.loop4 b{font:800 18px var(--f-display)}
.loop4 span{font-size:13.5px;color:var(--muted)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod{display:grid;gap:8px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;align-content:start}
.mod:hover{border-color:var(--acc)}
.mod .n{font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.today a{display:grid;gap:4px;text-decoration:none;color:var(--ink);border:1px dashed var(--acc);border-radius:10px;padding:12px;background:var(--acc-s)}
.today a b{font-size:15px}
.today a span{font-size:13.5px;color:var(--muted)}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.plan label{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;cursor:pointer}
.plan label b{font:600 12px var(--f-mono);color:var(--muted);display:block}

/* code drills */
.codeview{border:1px solid var(--line);border-radius:10px;background:var(--code);overflow-x:auto;padding:8px 0}
.ln{display:flex;font:13px/1.65 var(--f-mono);cursor:pointer;white-space:pre;min-width:max-content;border-left:3px solid transparent}
.ln:hover{background:var(--soft)}
.ln .no{width:42px;text-align:right;padding-right:12px;color:var(--muted);user-select:none;flex:none}
.ln .tx{padding-right:16px}
.ln.sel{background:var(--acc-s);border-left-color:var(--acc)}
.ln.hit{background:var(--ok-s);border-left-color:var(--ok)}
.ln.miss{background:var(--warn-s);border-left-color:var(--warn)}
.ln.extra{background:var(--bad-s);border-left-color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font:12px var(--f-mono);color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* threat lab */
.flows{display:grid;gap:6px}
.flow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14.5px;padding:8px 10px;border-radius:8px;background:var(--soft)}
.flow .arrow{font:12px var(--f-mono);color:var(--muted);text-align:center}
.flow .tb{font:600 10.5px var(--f-mono);color:var(--bad);border:1px dashed var(--bad);border-radius:4px;padding:2px 5px;white-space:nowrap}
@media (max-width:600px){.flow{grid-template-columns:1fr}}
.comps{display:flex;flex-wrap:wrap;gap:6px}
.prio{font:600 11px var(--f-mono);padding:2px 6px;border-radius:4px}
.prio.Critical{background:var(--bad-s);color:var(--bad)} .prio.High{background:var(--warn-s);color:var(--warn)} .prio.Medium{background:var(--acc-s);color:var(--acc)} .prio.Low{background:var(--soft);color:var(--muted)}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:9px;align-items:flex-start;font-size:15px;cursor:pointer}

/* triage */
.report{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.report .rh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;background:var(--soft)}
.report .rb{padding:16px;font-size:15.5px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:13.5px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.cvss{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 18px}
.cvss .m{display:grid;gap:5px}
.cvss .m span{font:600 11.5px var(--f-mono);color:var(--muted)}
.score{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.score .big{font:800 40px/1 var(--f-display);font-variant-numeric:tabular-nums}
.vec{font:12.5px var(--f-mono);word-break:break-all}

/* incident */
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.g2{border-color:var(--ok);background:var(--ok-s)} .opt.g1{border-color:var(--warn);background:var(--warn-s)} .opt.g0{border-color:var(--bad);background:var(--bad-s)}
.opt:disabled{cursor:default}
.steps{display:flex;gap:5px}
.steps i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.steps i.d{background:var(--acc)}

/* coding */
.tests{display:grid;gap:5px}
.test{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:14px;padding:7px 10px;border-radius:8px;background:var(--soft);align-items:start}
.test .r{font:700 12px var(--f-mono)}
.test.p .r{color:var(--ok)} .test.f .r{color:var(--bad)}
.test code{font:12px var(--f-mono);word-break:break-all}

/* questions */
.qtools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
@media (max-width:700px){.qtools{grid-template-columns:1fr}}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13.5px}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.qcard.known{border-left:4px solid var(--ok)}
.qcard.again{border-left:4px solid var(--warn)}
.qq{font-weight:700;font-size:16.5px;line-height:1.35}
.ans{display:grid;gap:9px;border-top:1px solid var(--line);padding-top:10px}
.flash{max-width:760px;margin:0 auto;width:100%}
.flash .qcard{padding:24px;min-height:260px;align-content:start}
.flash .qq{font:700 clamp(20px,2.4vw,26px)/1.25 var(--f-display)}

/* behavioral */
.star{display:grid;gap:10px}
.star label{display:grid;gap:4px;font:600 12px var(--f-mono);color:var(--muted)}
.fbgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.fbgrid div{border-radius:8px;padding:9px 11px;font-size:13.5px;background:var(--soft)}
.fbgrid div.ok{background:var(--ok-s)} .fbgrid div.warn{background:var(--warn-s)}
.fbgrid b{display:block;font:700 12px var(--f-mono)}

/* atlas (map) */
.atlas{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1050px){.atlas{grid-template-columns:1fr}}
.pillars{display:grid;gap:20px;min-width:0}
.pillar{display:grid;gap:9px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tile{position:relative;text-align:left;border:1px solid transparent;border-radius:10px;padding:10px 10px 12px;cursor:pointer;display:grid;gap:4px;min-height:88px;align-content:start}
.tile .code{font:800 22px/1 var(--f-display)}
.tile .nm{font-size:12.5px;line-height:1.25}
.tile .lv{position:absolute;top:9px;right:9px;display:flex;gap:2px}
.tile .lv i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.22}
.tile .lv i.on{opacity:1}
.tile.f{background:var(--pf-s)} .tile.f .code,.tile.f .lv{color:var(--pf)}
.tile.b{background:var(--pb-s)} .tile.b .code,.tile.b .lv{color:var(--pb)}
.tile.r{background:var(--pr-s)} .tile.r .code,.tile.r .lv{color:var(--pr)}
.tile.p{background:var(--pp-s)} .tile.p .code,.tile.p .lv{color:var(--pp)}
.tile.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.dpanel{display:grid;gap:15px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
@media (max-width:1050px){.dpanel{position:static;max-height:none}}
.dbig{font:800 34px/1 var(--f-display);padding:10px 12px;border-radius:10px;min-width:70px;text-align:center}
.dbig.f{background:var(--pf-s);color:var(--pf)} .dbig.b{background:var(--pb-s);color:var(--pb)} .dbig.r{background:var(--pr-s);color:var(--pr)} .dbig.p{background:var(--pp-s);color:var(--pp)}
.lbl{font:600 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rate button{font-size:12.5px;font-weight:600;padding:8px 4px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.rate button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.cov{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.track{overflow-x:auto;padding-bottom:4px}
.band{display:grid;grid-template-columns:repeat(8,minmax(135px,1fr));min-width:1080px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.band .st{padding:12px;display:grid;gap:8px;align-content:start;border-left:1px solid var(--line)}
.band .st:first-child{border-left:0}
.codes{display:flex;flex-wrap:wrap;gap:5px}
.codes button{font:700 12px var(--f-mono);border:0;border-radius:5px;padding:4px 7px;cursor:pointer}
.codes .f{background:var(--pf-s);color:var(--pf)} .codes .b{background:var(--pb-s);color:var(--pb)} .codes .r{background:var(--pr-s);color:var(--pr)} .codes .p{background:var(--pp-s);color:var(--pp)}

<script>
// ---------- state ----------
const KEY="prodsec-lab-v1";
let S={};
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){S={}}
["r","k","dr","tm","tr","ir","cc","code","st","plan","ds","lv","ln","sb","ia","fl","pd"].forEach(k=>{if(!S[k]||typeof S[k]!=="object")S[k]={}});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}updateMeter();renderRail()}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return "q"+(h>>>0).toString(36)}
QB.push(...QB2,...QB3);BEH.push(...BEH2);CONFLICTS.push(...CONFLICTS2.slice(0,2));QB.forEach(q=>q.id=hash(q.q));
window.__LOGS=()=>["t FAIL user=a ip=1.1.1.1","t FAIL user=a ip=1.1.1.1","t FAIL user=a ip=1.1.1.1","t FAIL user=b ip=2.2.2.2","t FAIL user=b ip=2.2.2.2","t FAIL user=b ip=2.2.2.2","t FAIL user=b ip=2.2.2.2","t FAIL user=b ip=2.2.2.2","t OK user=a ip=1.1.1.1","garbage line","t FAIL user=c ip=3.3.3.3"];
const b64u=s=>btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
window.__JWT=(h,p)=>b64u(JSON.stringify(h))+"."+b64u(JSON.stringify(p))+".sig";

// ---------- progress ----------
function prog(){
 const storyDone=id=>{const s=S.st[id];return s&&["s","t","a","r"].every(k=>(s[k]||"").trim().length>20)};
 return {
  questions:[QB.filter(q=>S.k[q.id]===1).length,QB.length],
  code:[DRILLS.filter(d=>S.dr[d.id]&&S.dr[d.id].solved).length,DRILLS.length],
  threat:[TM.filter(t=>S.tm[t.id]&&S.tm[t.id].rev).length,TM.length],
  triage:[TRIAGE.filter(t=>S.tr[t.id]&&S.tr[t.id].done).length,TRIAGE.length],
  incident:[IR.filter(t=>S.ir[t.id]!=null).length,IR.length],
  coding:[CODING.filter(c=>S.cc[c.id]).length,CODING.length],
  behavioral:[BEH.filter(b=>storyDone(b.id)).length,BEH.length],
  design:[DESIGNS.filter(d=>S.ds[d.id]&&S.ds[d.id].rev).length,DESIGNS.length],
  stories:[STORYBANK.filter(x=>S.sb[x.id]).length,STORYBANK.length],
  cloud:[(()=>{const ia=S.ia||{};const c=o=>Object.keys(o||{}).length;return c(ia.p)+c(ia.w)+c(ia.e)+c(ia.t)+(Object.keys(ia.q||{}).length>=CT_QS.length?1:0)})(),IAM_PREDICT.length+IAM_WRITE.length+IAM_PRIVESC.length+IAM_TRUST.length+1],
  flows:[FLOWS.filter(f=>S.fl&&S.fl[f.id]).length,FLOWS.length],
  pdf:[Object.values(S.pd||{}).filter(Boolean).length,PDFMAP.reduce((a,[,it])=>a+it.length,0)],
  map:[DOM.filter(d=>(S.r[d.c]||0)>0).length,DOM.length]
 }}
function updateMeter(){const p=prog();const v=Object.values(p);const pct=Math.round(v.reduce((a,[d,t])=>a+d/t,0)/v.length*100);$("#pct").textContent=pct+"%";$("#pctbar").style.width=pct+"%"}

// ---------- routing ----------
const ROUTES=[
 ["Plan",[["home","Start here"],["loops","How loops work"],["pdf","Your PDF questions"],["mock","Mock interview"]]],
 ["Learn",[["map","Domain map"],["system","SaaS system"],["flows","Protocol walkthroughs"],["ai","AI at every layer"],["metrics","Metrics & MTTR"]]],
 ["Do",[["design","Architecture deep dives"],["cloud","Cloud IAM lab"],["code","Code review drills"],["threat","Threat model lab"],["triage","Triage & CVSS"],["incident","Incident sims"],["coding","Coding lab"]]],
 ["Recall",[["questions","Question bank"]]],
 ["Tell",[["stories","Your story bank"],["behavioral","Behavioral stories"]]]
];
const R={};
function route(){return (location.hash||"#home").slice(1).split("-")[0]||"home"}
function renderRail(){
 const p=prog(),cur=route();
 $("#rail").innerHTML=ROUTES.map(([g,items])=>`<div class="grp"><div class="eyebrow">${g}</div>${items.map(([id,name])=>`<a class="nav${cur===id?" on":""}" href="#${id}">${name}${p[id]?`<span class="ct">${p[id][0]}/${p[id][1]}</span>`:""}</a>`).join("")}</div>`).join("");
}
function go(){const id=route();renderRail();const v=$("#view");(R[id]||R.home)(v);window.scrollTo(0,0)}
window.addEventListener("hashchange",go);

// ================= HOME =================
R.home=v=>{
 const p=prog();
 const next=a=>a.find(x=>x)||null;
 const d=next(DRILLS.map(x=>!(S.dr[x.id]&&S.dr[x.id].solved)&&x));
 const t=next(TM.map(x=>!(S.tm[x.id]&&S.tm[x.id].rev)&&x));
 const tr=next(TRIAGE.map(x=>!(S.tr[x.id]&&S.tr[x.id].done)&&x));
 const b=next(BEH.map(x=>!(S.st[x.id]&&S.st[x.id].r)&&x));
 const PLAN=[
  ["Day 1","Rate yourself on all 31 domains in the Domain map"],["Day 2","Walk a request through the SaaS system; read the 9 steps"],
  ["Day 3","Code review drills 1-5; say each fix out loud"],["Day 4","Threat model: profile upload. Time yourself: 15 minutes"],
  ["Day 5","Protocol walkthroughs (OAuth, TLS, CORS) + Web/AuthN flashcards"],["Day 6","Triage 5 reports and score them in the CVSS calculator"],
  ["Day 7","Story bank: fix the number conflicts; write 3 STAR stories"],["Day 8","Code review drills 6-12"],
  ["Day 9","Threat model: payments + LLM agent"],["Day 10","Cloud IAM lab: predict + write policies + CloudTrail case"],
  ["Day 11","Coding lab: all 5 challenges"],["Day 12","Code review drills 13-19 (IaC, CI, containers)"],
  ["Day 13","Architecture deep dives: authZ, secrets, ASPM; Metrics lab"],["Day 14","Two 45-minute mock interviews, recorded; redo anything you scored 1–2"]];
 const MODS=[["map","Domain map","See the whole field: 31 domains, how they fit, how a programme is built"],["system","SaaS system","Click through a real architecture and follow a request hop by hop"],["ai","AI at every layer","Where AI speeds up each stage, the guardrails, and the metric it moves"],["metrics","Metrics & MTTR","Compute MTTR and SLA compliance yourself; pull levers and watch MTTR fall"],["design","Architecture deep dives","10 senior design prompts: plan your answer, then compare"],["cloud","Cloud IAM lab","Predict decisions, write least-privilege policies against tests, find escalation paths, investigate CloudTrail"],["flows","Protocol walkthroughs","Step through OAuth+PKCE, TLS 1.3, CORS, CSRF, SSRF→IMDS, GitHub OIDC, SAML, Kerberos"],["mock","Mock interview","A timed loop built from the whole lab, with self-scoring and history"],["pdf","Your PDF questions","All 161 questions from your three PDFs, mapped and answerable inline"],["stories","Your story bank","Your real stories from your PDFs, framed senior, with number conflicts flagged"],["code","Code review drills","Click the vulnerable lines in 19 real-looking snippets across 9 stacks"],["threat","Threat model lab","Write your own threat model, then compare with a ranked model answer"],["triage","Triage & CVSS","Judge bug bounty reports and score them with a live CVSS 3.1 calculator"],["incident","Incident sims","Make decisions under pressure in three realistic incidents"],["coding","Coding lab","Write and run security scripts against tests, right in the page"],["questions","Question bank",QB.length+" questions with 30-second answers, follow-ups and flashcards"],["behavioral","Behavioral stories","Build STAR stories with live feedback on numbers, ownership and length"]];
 v.innerHTML=`
 <section class="hero">
  <div style="display:grid;gap:16px">
   <div class="eyebrow">Senior AppSec · Product security · interview preparation</div>
   <h1>Learn it by doing it</h1>
   <p style="font-size:18px" class="muted">Every round you will face in a senior loop has a hands-on module here: code review, threat modeling, triage, incidents, coding, design and behavioral. Do the exercise first, then read the model answer. Your progress is saved in this browser.</p>
  </div>
  <div class="loop4">
   <div><b>Do</b><span>try it cold, no notes</span></div>
   <div><b>Check</b><span>compare with the model answer</span></div>
   <div><b>Say</b><span>explain it out loud in 60s</span></div>
   <div><b>Recall</b><span>flashcards until it sticks</span></div>
  </div>
 </section>
 <section style="display:grid;gap:12px">
  <div class="head"><div class="eyebrow">Today's 45 minutes</div><h2>Your next four reps</h2></div>
  <div class="today">
   ${d?`<a href="#code-${d.id}"><span class="eyebrow">Code review · 10 min</span><b>${esc(d.title)}</b><span>${esc(d.lang)}</span></a>`:""}
   ${t?`<a href="#threat-${t.id}"><span class="eyebrow">Threat model · 15 min</span><b>${esc(t.title)}</b><span>${esc(t.asked)}</span></a>`:""}
   ${tr?`<a href="#triage-${tr.id}"><span class="eyebrow">Triage · 5 min</span><b>${esc(tr.title)}</b><span>Score it with CVSS</span></a>`:""}
   <a href="#questions"><span class="eyebrow">Recall · 10 min</span><b>15 flashcards</b><span>${p.questions[1]-p.questions[0]} still to master</span></a>
   ${b?`<a href="#behavioral-${b.id}"><span class="eyebrow">Story · 5 min</span><b>${esc(b.q)}</b><span>Draft your STAR answer</span></a>`:""}

 </section>

 </section>
 <section class="row"><span class="muted small">Progress lives only in this browser.</span><span class="confirm" id="resetwrap"><button class="btn ghost" id="reset" type="button">Reset my progress</button></span></section>`;
 $$(".plan input").forEach(c=>c.onchange=()=>{S.plan[c.dataset.i]=c.checked;save()});
 $("#reset").onclick=()=>{$("#resetwrap").innerHTML=`<span class="small">Erase all progress?</span><button class="btn" id="rsy" type="button">Erase</button><button class="btn ghost" id="rsn" type="button">Keep</button>`;
  $("#rsy").onclick=()=>{S={r:{},k:{},dr:{},tm:{},tr:{},ir:{},cc:{},code:{},st:{},plan:{},ds:{},lv:{},ln:{},sb:{},ia:{},fl:{},pd:{}};save();go()};$("#rsn").onclick=()=>go()};
};

// ================= LOOPS =================
R.loops=v=>{
 v.innerHTML=`
 <div class="head"><div class="eyebrow">Plan</div><h2>How senior security loops work</h2><p class="muted">The rounds are similar everywhere: threat modeling or design review, code review or practical coding, cloud/IAM or infrastructure, an incident scenario, and behavioral. What changes is the weight. Interviewers reward judgement and prioritisation over trivia.</p></div>
 <div class="tablebox"><table><thead><tr><th>Company type</th><th>Typical rounds</th><th>What they weigh most</th></tr></thead><tbody>${LOOPS.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div>
 <div class="cad">
  <div class="card"><h3 style="color:var(--ok)">What gets offers</h3><ul class="list small" style="margin-top:8px"><li>Drawing trust boundaries first, then letting threats follow</li><li>Ranking threats and naming the two you'd fix first</li><li>A fix that makes the launch safe enough to ship</li><li>Writing a least-privilege policy on the spot</li><li>Incidents with a calm order: contain, scope, preserve, root cause</li><li>Stories with real numbers and a real mistake</li></ul></div>
  <div class="card"><h3 style="color:var(--bad)">What gets rejections</h3><ul class="list small" style="margin-top:8px"><li>Reciting frameworks without prioritising</li><li>Calling everything critical</li><li>Proposing a WAF for an authorization bug</li><li>Security as a blocker rather than trade-offs</li><li>Vague answers with no specific control or owner</li><li>Stories where nothing ever went wrong</li></ul></div>
  <div class="card"><h3>Technique in the room</h3><ul class="list small" style="margin-top:8px"><li>Repeat the question back and ask one clarifying question</li><li>State assumptions out loud ("I'll assume it's internet-facing")</li><li>Think aloud; draw or write as you go</li><li>For unknowns: "I haven't worked with X, but from first principles I'd expect…"</li><li>Breadth first, then go deep where they lean in</li><li>Close each answer with how you'd verify it</li></ul></div>
 </div>
 <details class="fold" open><summary><h3>Round by round: how to practise each one here</h3></summary><div class="inner">
  <div class="tablebox"><table><thead><tr><th>Round</th><th>What they test</th><th>Practise in</th></tr></thead><tbody>
   <tr><td>Threat model / security design</td><td>Structure, trust boundaries, ranking, pragmatic controls</td><td><a href="#threat">Threat model lab</a>, <a href="#system">SaaS system</a></td></tr>
   <tr><td>Secure code review</td><td>Spotting real bugs fast, exact fixes, class-level prevention</td><td><a href="#code">Code review drills</a></td></tr>
   <tr><td>Coding / scripting</td><td>Practical scripts: parse logs, detect secrets, validate input</td><td><a href="#coding">Coding lab</a></td></tr>

// ================= TRIAGE & CVSS =================
const CV={AV:{N:.85,A:.62,L:.55,P:.2},AC:{L:.77,H:.44},UI:{N:.85,R:.62},C:{H:.56,L:.22,N:0},I:{H:.56,L:.22,N:0},A:{H:.56,L:.22,N:0}};
const prV=(pr,s)=>pr==="N"?.85:pr==="L"?(s==="C"?.68:.62):(s==="C"?.5:.27);
function roundup(x){const i=Math.round(x*100000);return i%10000===0?i/100000:(Math.floor(i/10000)+1)/10}
function cvss(v){const iss=1-(1-CV.C[v.C])*(1-CV.I[v.I])*(1-CV.A[v.A]);const imp=v.S==="U"?6.42*iss:7.52*(iss-.029)-3.25*Math.pow(iss-.02,15);const ex=8.22*CV.AV[v.AV]*CV.AC[v.AC]*prV(v.PR,v.S)*CV.UI[v.UI];if(imp<=0)return 0;return v.S==="U"?roundup(Math.min(imp+ex,10)):roundup(Math.min(1.08*(imp+ex),10))}
const pv=s=>Object.fromEntries(s.split("/").map(x=>x.split(":")));
const vs=v=>["AV","AC","PR","UI","S","C","I","A"].map(k=>k+":"+v[k]).join("/");
const sevOf=x=>x===0?"None":x<4?"Low":x<7?"Medium":x<9?"High":"Critical";
const SEVS=["Critical","High","Medium","Low","None"];
const METRICS=[["AV","Attack vector",[["N","Network"],["A","Adjacent"],["L","Local"],["P","Physical"]]],["AC","Attack complexity",[["L","Low"],["H","High"]]],["PR","Privileges required",[["N","None"],["L","Low"],["H","High"]]],["UI","User interaction",[["N","None"],["R","Required"]]],["S","Scope",[["U","Unchanged"],["C","Changed"]]],["C","Confidentiality",[["H","High"],["L","Low"],["N","None"]]],["I","Integrity",[["H","High"],["L","Low"],["N","None"]]],["A","Availability",[["H","High"],["L","Low"],["N","None"]]]];
let trSel=null;
R.triage=v=>{
 const want=location.hash.split("-").slice(1).join("-");if(want&&TRIAGE.find(t=>t.id===want))trSel=want;if(!trSel)trSel=TRIAGE[0].id;
 v.innerHTML=`<div class="head"><div class="eyebrow">Do · triage round (bounty platforms, PSIRT, AppSec on-call)</div><h2>Triage the report, then score it</h2><p class="muted">Decide if it's valid, pick a severity, and build the CVSS 3.1 vector in the calculator. Then compare. The lesson in most of these: CVSS is the starting point and context decides the final severity.</p></div>
 <div class="split"><div class="picker" id="rpick"></div><div id="rwork" style="display:grid;gap:14px;min-width:0"></div></div>`;
 const pick=()=>{$("#rpick").innerHTML=TRIAGE.map(t=>{const st=S.tr[t.id];return `<button type="button" class="pick${t.id===trSel?" on":""}" data-id="${t.id}"><span class="t">${esc(t.title)}</span><span class="m"><span>claimed ${t.reporter}</span>${st&&st.done?`<span class="tag ${st.ok?"ok":"warn"}">${st.ok?"matched":"reviewed"}</span>`:""}</span></button>`}).join("");$$("#rpick .pick").forEach(b=>b.onclick=()=>{trSel=b.dataset.id;history.replaceState(null,"","#triage-"+trSel);pick();work()})};
 const work=()=>{const t=TRIAGE.find(x=>x.id===trSel);const st=S.tr[t.id]=S.tr[t.id]||{};const vec=pv(st.vec||"AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N");
  $("#rwork").innerHTML=`<div class="report"><div class="rh"><b>${esc(t.title)}</b><span class="tag warn">Reporter says: ${t.reporter}</span></div><div class="rb">${esc(t.body)}</div></div>
  <div class="card" style="display:grid;gap:14px"><div><div class="lbl">1 · Verdict</div><div class="seg" id="verd">${["Valid","Informative","Not applicable"].map(x=>`<button type="button" aria-pressed="${st.verdict===x}" data-v="${x}">${x}</button>`).join("")}</div></div>
   <div><div class="lbl">2 · Your severity</div><div class="seg" id="sevs">${SEVS.map(x=>`<button type="button" aria-pressed="${st.sev===x}" data-v="${x}">${x}</button>`).join("")}</div></div>
   <div><div class="lbl">3 · CVSS 3.1 vector (optional for informative)</div><div class="cvss" id="calc">${METRICS.map(([k,n,opts])=>`<div class="m"><span>${n}</span><div class="seg" data-k="${k}">${opts.map(([c,l])=>`<button type="button" data-c="${c}" aria-pressed="${vec[k]===c}">${l}</button>`).join("")}</div></div>`).join("")}</div>
   <div class="score" style="margin-top:12px"><span class="big" id="cs"></span><div><b id="csev"></b><div class="vec muted" id="cvec"></div></div></div></div>
   <div class="row"><button class="btn pri" id="rsub" type="button">Submit triage</button></div></div><div id="rans"></div>`;
  const upd=()=>{const s=cvss(vec);$("#cs").textContent=s.toFixed(1);$("#csev").textContent=sevOf(s)+" (CVSS)";$("#cvec").textContent="CVSS:3.1/"+vs(vec);st.vec=vs(vec);save()};
  $$("#calc .seg").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{vec[g.dataset.k]=b.dataset.c;g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));upd()}));upd();
  const segp=(id,key)=>$$("#"+id+" button").forEach(b=>b.onclick=()=>{st[key]=b.dataset.v;$$("#"+id+" button").forEach(x=>x.setAttribute("aria-pressed",x===b));save()});segp("verd","verdict");segp("sevs","sev");
  const show=()=>{const exp=t.vec?cvss(pv(t.vec)):0;const vOk=st.verdict===t.verdict;const sd=Math.abs(SEVS.indexOf(st.sev)-SEVS.indexOf(t.sev));const ok=vOk&&sd===0;st.done=true;st.ok=ok;save();pick();
   $("#rans").innerHTML=`<div class="card" style="display:grid;gap:12px"><div class="fb ${ok?"ok":vOk&&sd===1?"warn":"bad"}"><b>${ok?"Matches the expected triage.":vOk&&sd===1?"Close: one severity level apart.":"Different from the expected triage."}</b>Expected: <b style="display:inline">${t.verdict}</b>, severity <b style="display:inline">${t.sev}</b>. You said ${esc(st.verdict||"no verdict")}, ${esc(st.sev||"no severity")}.</div>
   ${t.vec?`<div class="score"><span class="big">${exp.toFixed(1)}</span><div><b>${sevOf(exp)} by CVSS</b><div class="vec muted">CVSS:3.1/${t.vec}</div></div></div>`:`<p class="muted">No CVSS vector: there is no security impact to score.</p>`}
   <div><div class="lbl">Reasoning</div><p>${esc(t.why)}</p></div><div><div class="lbl">What to do next</div><p>${esc(t.next)}</p></div></div>`};
  $("#rsub").onclick=()=>{if(!st.verdict||!st.sev){$("#rans").innerHTML=`<div class="fb warn"><b>Pick a verdict and a severity first.</b>Commit to an answer before you compare; that's the skill being tested.</div>`;return}show()};
  if(st.done)show();
 };
 pick();work();
};

let mtRows=null;

 v.innerHTML=`<div class="head"><div class="eyebrow">Learn by computing · the metrics round</div><h2>Metrics and MTTR, hands-on</h2><p class="muted">Senior interviewers probe numbers: how you define them, how you measured them, and what actually moved them. Compute them yourself here, then pull the levers that reduce MTTR and see which stage each one attacks.</p></div>
 <details class="fold" open><summary><h3>1 · The metrics that matter, and how they're gamed</h3></summary><div class="inner"><div class="tablebox"><table><thead><tr><th>Metric</th><th>Formula</th><th>Answers</th><th>Pitfall to mention</th></tr></thead><tbody>${METRICS.map(m=>`<tr><td><b>${esc(m[0])}</b></td><td class="mono small">${esc(m[1])}</td><td>${esc(m[2])}</td><td>${esc(m[3])}</td></tr>`).join("")}</tbody></table></div></div></details>
 <details class="fold" open><summary><h3>2 · Compute MTTR and SLA compliance yourself</h3></summary><div class="inner">
  <p class="muted">Twelve sample findings. Today is day 100. SLA: Critical 7, High 30, Medium 90, Low 180 days. Before looking at the results, guess the median High MTTR. Then edit the dates and watch the numbers move. Leave "closed" empty for open findings.</p>
  <div class="cols2"><div class="tablebox"><table style="min-width:420px"><thead><tr><th>ID</th><th>Severity</th><th>Found (day)</th><th>Closed (day)</th></tr></thead><tbody id="mtbody"></tbody></table></div><div id="mtout" style="display:grid;gap:10px;align-content:start"></div></div>
  <div class="row"><button class="btn ghost" id="mtreset" type="button">Reset sample data</button></div></div></details>
 <details class="fold" open><summary><h3>3 · Where does MTTR actually go? Pull the levers</h3></summary><div class="inner">

 <div class="card"><div class="lbl">Say it in an interview</div><p class="say">I break MTTR into stages before trying to improve it. In most programmes the fix itself is a day or two; the weeks go into triage, ownership and backlog wait. So my levers are tuned rules and AI triage, automatic owner routing, risk-based SLAs inside sprint planning, and tickets that ship with a PoC and the exact fix. I report median and p90 by severity, and 'closed' means verified.</p><p class="small" style="margin-top:8px"><a href="#stories-mttr">See your own MTTR story →</a></p></div>`;
 // ---- table
 const sevs=["Critical","High","Medium","Low"];
 const body=()=>{$("#mtbody").innerHTML=mtRows.map((r,i)=>`<tr><td class="mono small">${r[0]}</td><td><select data-i="${i}" data-c="1" aria-label="Severity ${r[0]}">${sevs.map(s=>`<option${s===r[1]?" selected":""}>${s}</option>`).join("")}</select></td><td><input type="text" inputmode="numeric" data-i="${i}" data-c="2" value="${r[2]}" aria-label="Found day ${r[0]}" style="width:80px"></td><td><input type="text" inputmode="numeric" data-i="${i}" data-c="3" value="${r[3]}" aria-label="Closed day ${r[0]}" style="width:80px"></td></tr>`).join("");

 const med=a=>{if(!a.length)return null;const b=[...a].sort((x,y)=>x-y),m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2};
 const p90=a=>{if(!a.length)return null;const b=[...a].sort((x,y)=>x-y);return b[Math.min(b.length-1,Math.ceil(.9*b.length)-1)]};

  const rows=sevs.map(sv=>{const closed=mtRows.filter(r=>r[1]===sv&&r[3]!=="").map(r=>r[3]-r[2]);const mean=closed.length?closed.reduce((a,b)=>a+b,0)/closed.length:null;return [sv,closed.length,mean,med(closed),p90(closed)]});

  <p class="small muted">Notice: High has a mean far above its median because of one slow finding. That's why you report median and p90. And SLA compliance on closed items hides the open ones past SLA, so report both.</p>`};

 const sim=()=>{const base=S.lv.base,after={};MTTR_STAGES.forEach(([k])=>{let d=+base[k]||0;MTTR_LEVERS.forEach(([id,,eff])=>{if(S.lv.on[id]&&eff[k])d*=1-eff[k]});after[k]=d});

  const vp=S.lv.on.vpatch;

 const want=location.hash.split("-")[1];if(want&&FLOWS.find(x=>x.id===want)&&want!==flSel){flSel=want;flStep=0}if(!flSel)flSel=FLOWS[0].id;
 v.innerHTML=`<div class="head"><div class="eyebrow">Learn · "walk me through how X works"</div><h2>Protocol walkthroughs</h2><p class="muted">Step through the flows interviewers ask you to explain, one message at a time. Each step shows what happens and where attackers break it. Practise narrating the whole flow out loud without looking.</p></div>
 <div class="split"><div class="picker" id="fpick"></div><div style="display:grid;gap:14px;min-width:0"><div class="board"><div class="svgbox" style="background-image:none"><svg id="seq" role="img" aria-label="Sequence diagram"></svg></div></div><div class="card" id="fpanel" style="display:grid;gap:10px"></div></div></div>`;
 const pick=()=>{$("#fpick").innerHTML=FLOWS.map(f=>`<button type="button" class="pick${f.id===flSel?" on":""}" data-id="${f.id}"><span class="t">${esc(f.title)}</span><span class="m"><span>${f.steps.length} steps</span>${S.fl&&S.fl[f.id]?'<span class="tag ok">walked</span>':""}</span></button>`).join("");$$("#fpick .pick").forEach(b=>b.onclick=()=>{flSel=b.dataset.id;flStep=0;history.replaceState(null,"","#flows-"+flSel);pick();draw()})};
 const draw=()=>{const f=FLOWS.find(x=>x.id===flSel),n=f.actors.length,W=900,top=70,rh=54,H=top+f.steps.length*rh+30;
  const X=i=>n===1?W/2:90+i*((W-180)/(n-1));const svg=$("#seq");svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.style.minWidth="680px";
  let h=`<defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--muted)"/></marker><marker id="fa2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--acc)"/></marker></defs>`;
  f.actors.forEach((a,i)=>{h+=`<rect x="${X(i)-80}" y="10" width="160" height="36" rx="8" style="fill:var(--soft);stroke:var(--line)"/><text x="${X(i)}" y="33" text-anchor="middle" style="font:700 12.5px var(--f-body);fill:var(--ink)">${esc(a)}</text><line x1="${X(i)}" y1="46" x2="${X(i)}" y2="${H-10}" style="stroke:var(--line);stroke-dasharray:4 4"/>`});
  f.steps.forEach((s,i)=>{const y=top+i*rh+20,x1=X(s[0]),x2=X(s[1]),on=i===flStep,past=i<flStep;const lab=s[2].length>64?s[2].slice(0,62)+"…":s[2];
   h+=`<g class="sq" data-i="${i}" style="cursor:pointer;opacity:${on?1:past?.75:.35}"><rect x="${Math.min(x1,x2)}" y="${y-30}" width="${Math.abs(x2-x1)||40}" height="38" style="fill:transparent"/><line x1="${x1}" y1="${y}" x2="${x2+(x2>x1?-4:4)}" y2="${y}" style="stroke:${on?"var(--acc)":"var(--muted)"};stroke-width:${on?2.6:1.4}" marker-end="url(#${on?"fa2":"fa"})"/><text x="${(x1+x2)/2}" y="${y-8}" text-anchor="middle" style="font:${on?600:400} 11px var(--f-mono);fill:${on?"var(--ink)":"var(--muted)"}">${i+1}. ${esc(lab)}</text>${s[4]?`<circle cx="${Math.max(x1,x2)+12}" cy="${y-4}" r="5" style="fill:var(--bad)"/>`:""}</g>`});
  svg.innerHTML=h;$$("#seq .sq").forEach(g=>g.onclick=()=>{flStep=+g.dataset.i;draw()});
  const s=f.steps[flStep];
  $("#fpanel").innerHTML=`<div class="row" style="justify-content:space-between"><span class="eyebrow">Step ${flStep+1} of ${f.steps.length} · ${esc(f.actors[s[0]])} → ${esc(f.actors[s[1]])}</span><div class="steps">${f.steps.map((_,i)=>`<i class="${i<=flStep?"d":""}"></i>`).join("")}</div></div><p class="mono small">${esc(s[2])}</p><p style="font-size:16.5px">${esc(s[3])}</p>${s[4]?`<div class="fb bad"><b>Where it breaks</b>${esc(s[4])}</div>`:""}<div class="row"><button class="btn" id="fp" type="button" ${flStep===0?"disabled":""}>Previous</button><button class="btn pri" id="fn" type="button" ${flStep===f.steps.length-1?"disabled":""}>Next message</button></div>`;
  $("#fp").onclick=()=>{flStep--;draw()};$("#fn").onclick=()=>{flStep++;draw()};
  if(flStep===f.steps.length-1){S.fl=S.fl||{};if(!S.fl[f.id]){S.fl[f.id]=true;save();pick()}}};
 pick();draw();
};

// ================= MOCK INTERVIEW =================
let mockTimer=null;
function mockTick(){const chip=$("#mockchip");if(!chip)return;const m=S.mock;if(!m||!m.items||m.seg>=m.items.length||!m.endsAt){chip.innerHTML="";return}
 const left=Math.max(0,Math.round((m.endsAt-Date.now())/1000));const it=m.items[m.seg];
 chip.innerHTML=`<a href="#mock" class="tag ${left===0?"bad":"acc"}" style="text-decoration:none">Mock · ${esc(it.label)} · ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</a>`}
function startTick(){if(mockTimer)clearInterval(mockTimer);mockTimer=setInterval(mockTick,1000);mockTick()}
R.mock=v=>{
 S.mh=Array.isArray(S.mh)?S.mh:[];
 const rnd=a=>a[Math.floor(Math.random()*a.length)];
 const build=fmt=>MOCK_FORMATS[fmt].map(([k,min])=>{
  if(k==="design"){const d=rnd(DESIGNS);return {k,min,label:"Design",title:d.title,href:"#design-"+d.id,hint:"Clarify, components, flow, trade-offs, failure modes, rollout."}}
  if(k==="threat"){const t=rnd(TM);return {k,min,label:"Threat model",title:t.title,href:"#threat-"+t.id,hint:"Trust boundaries first, then STRIDE, then rank and pick two."}}
  if(k==="code"){const d=rnd(DRILLS);return {k,min,label:"Code review",title:d.title+" ("+d.lang+")",href:"#code-"+d.id,hint:"Find source and sink, name the class, give the exact fix and the class-level prevention."}}
  if(k==="cloud"){const p=rnd(IAM_WRITE);return {k,min,label:"Cloud IAM",title:p.title,href:"#cloud-write",hint:"Write it least-privilege, then explain each condition."}}
  if(k==="story"){const b=rnd(BEH);return {k,min,label:"Behavioral",title:b.q,href:"#behavioral-"+b.id,hint:"STAR, 'I' not 'we', a number, a trade-off, a learning. Under 2.5 minutes."}}
  const qs=[...QB].sort(()=>Math.random()-.5).slice(0,3);return {k,min,label:"Fundamentals",title:"Three rapid questions",qs:qs.map(q=>q.id),hint:"30 seconds each, then one deeper layer."}});
 const render=()=>{const m=S.mock;
  v.innerHTML=`<div class="head"><div class="eyebrow">Test · reps under time pressure</div><h2>Mock interview</h2><p class="muted">Generates a realistic loop from everything in the lab and times each segment. Say your answers out loud (record yourself on your phone if you can), then open the linked exercise to compare. The timer keeps running in the top bar while you move around the lab.</p></div>
  <div class="card" style="display:grid;gap:10px"><div class="lbl">Choose a format</div><div class="row">${Object.keys(MOCK_FORMATS).map(f=>`<button class="btn" type="button" data-f="${f}">${f}-minute round</button>`).join("")}</div><p class="small muted">30: threat model, questions, story · 45: design, code review, questions, story · 60: adds a cloud IAM segment.</p></div>
  ${m&&m.items?`<div class="card" style="display:grid;gap:12px"><div class="row" style="justify-content:space-between"><h3>Your ${m.fmt}-minute loop</h3><div class="row"><button class="btn pri" id="mstart" type="button">${m.endsAt?"Next segment":"Start timer"}</button><button class="btn ghost" id="mstop" type="button">End mock</button></div></div>
   ${m.items.map((it,i)=>`<div class="mseg${i===m.seg&&m.endsAt?" cur":""}${i<m.seg?" done":""}"><div class="row" style="justify-content:space-between"><span class="eyebrow">${i+1} · ${esc(it.label)} · ${it.min} min</span>${i<m.seg?'<span class="tag ok">done</span>':""}</div><b>${esc(it.title)}</b><p class="small muted">${esc(it.hint)}</p>
    ${it.qs?`<ol class="list">${it.qs.map(id=>{const q=QB.find(x=>x.id===id);return q?`<li>${esc(q.q)} <details><summary class="small" style="cursor:pointer">answer</summary><p class="small">${esc(q.a)}</p></details></li>`:""}).join("")}</ol>`:`<a class="chip" href="${it.href}">Open the exercise to compare →</a>`}
    ${i<m.seg||(m.finished)?`<div class="row" style="gap:6px"><span class="small muted">Self-score:</span>${[1,2,3,4].map(s=>`<button type="button" class="btn${(m.scores||{})[i]===s?" pri":""}" data-s="${s}" data-i="${i}" style="padding:4px 10px">${s}</button>`).join("")}<span class="small muted">1 lost · 2 shaky · 3 solid · 4 strong</span></div>`:""}</div>`).join("")}
   </div>`:""}
  ${S.mh.length?`<div class="card"><div class="lbl">History</div><div class="tablebox"><table style="min-width:420px"><thead><tr><th>Date</th><th>Format</th><th>Average self-score</th></tr></thead><tbody>${S.mh.slice(-10).reverse().map(h=>`<tr><td class="mono small">${esc(h.d)}</td><td>${h.f} min</td><td class="mono">${h.a}</td></tr>`).join("")}</tbody></table></div></div>`:""}`;
  $$("[data-f]").forEach(b=>b.onclick=()=>{S.mock={fmt:b.dataset.f,items:build(b.dataset.f),seg:0,endsAt:null,scores:{}};save();render();mockTick()});
  if(m&&m.items){
   $("#mstart").onclick=()=>{if(!m.endsAt){m.endsAt=Date.now()+m.items[0].min*60000}else{m.seg++;if(m.seg>=m.items.length){m.endsAt=null;m.finished=true}else m.endsAt=Date.now()+m.items[m.seg].min*60000}save();startTick();render()};
   $("#mstop").onclick=()=>{const sc=Object.values(m.scores||{});if(sc.length)S.mh.push({d:new Date().toISOString().slice(0,10),f:m.fmt,a:(sc.reduce((a,b)=>a+b,0)/sc.length).toFixed(1)});S.mock=null;save();mockTick();render()};
   $$("[data-s]").forEach(b=>b.onclick=()=>{m.scores=m.scores||{};m.scores[b.dataset.i]=+b.dataset.s;save();render()});
  }};
 render();
};

// ================= PDF COVERAGE INDEX =================
R.pdf=v=>{
 S.pd=S.pd||{};
 const findQ=ref=>QB.find(q=>q.q.toLowerCase().includes(ref.toLowerCase()));
 const total=PDFMAP.reduce((a,[,it])=>a+it.length,0),done=PDFMAP.reduce((a,[,it])=>a+it.filter(x=>S.pd[x[0]+"|"+x[1]]).length,0);
 const TAG={q:["Question bank","acc"],b:["STAR builder","warn"],s:["Story bank","ok"],m:["Module","acc"]};
 v.innerHTML=`<div class="head"><div class="eyebrow">Plan · coverage check</div><h2>Every question from your PDFs</h2><p class="muted">All ${total} questions and stories from your three PDFs (AppSec Interview Q&A, Senior Behavioral Q&A, ProductSec Transition Stories), each mapped to where it lives in the lab. Open a row to see the answer right here. Tick it when you can answer it out loud without looking.</p></div>
 <div class="card" style="display:grid;gap:8px"><div class="row" style="justify-content:space-between"><b>${done} of ${total} ready</b><span class="mono small muted">${Math.round(done/total*100)}%</span></div><div class="bar"><i style="width:${done/total*100}%"></i></div></div>
 <div class="fb warn"><b>Corrections found while mapping your PDFs</b><ul class="list small">${CONFLICTS2.map(c=>`<li><b style="display:inline">${esc(c[0])}:</b> ${esc(c[2])} ${esc(c[3])}</li>`).join("")}</ul></div>
 ${PDFMAP.map(([sec,items],si)=>`<details class="fold"${si===0?" open":""}><summary><h3>${esc(sec)} <span class="mono small muted">${items.filter(x=>S.pd[x[0]+"|"+x[1]]).length}/${items.length}</span></h3></summary><div class="inner" style="gap:6px">${items.map((x,i)=>{const key=x[0]+"|"+x[1];return `<details class="prow" data-k="${esc(key)}" data-sec="${si}" data-i="${i}"><summary><span class="mono small plab">${esc(x[0])}</span><span class="pq">${esc(x[1])}</span><span class="tag ${TAG[x[2]][1]}">${TAG[x[2]][0]}</span>${S.pd[key]?'<span class="tag ok">ready</span>':""}</summary><div class="pbody"></div></details>`}).join("")}</div></details>`).join("")}`;
 $$(".prow").forEach(d=>d.addEventListener("toggle",()=>{if(!d.open)return;const x=PDFMAP[+d.dataset.sec][1][+d.dataset.i],key=d.dataset.k,body=d.querySelector(".pbody");let h="";
  if(x[2]==="q"){const q=findQ(x[3]);h=`<p class="qq">${esc(q.q)}</p><p><b>30-second answer.</b> ${esc(q.a)}</p>${q.p&&q.p.length?`<ul class="list small">${q.p.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}<p class="small"><b>Likely follow-up:</b> ${esc(q.f)}</p>`}
  if(x[2]==="b"){const b=BEH.find(y=>y.id===x[3]);h=`<p class="qq">${esc(b.q)}</p><p class="muted small"><b>Testing:</b> ${esc(b.tests)}</p><p class="say">${esc(b.guide)}</p><p class="small">${esc(b.outline)}</p><a class="chip" href="#behavioral-${b.id}">Write it in the STAR builder →</a>`}
  if(x[2]==="s"){const s=STORYBANK.find(y=>y.id===x[3]);h=`<p class="qq">${esc(s.title)}</p>${[["S",s.s],["T",s.t],["A",s.a],["R",s.r]].map(([k,t])=>`<p class="small"><b>${k}:</b> ${esc(t)}</p>`).join("")}<a class="chip" href="#stories-${s.id}">Open in story bank →</a>`}
  if(x[2]==="m"){h=`<a class="chip" href="${x[3][0]}">${esc(x[3][1])} →</a>`}
  body.innerHTML=h+`<label class="small" style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" ${S.pd[key]?"checked":""}> I can answer this out loud without looking</label>`;
  body.querySelector("input").onchange=e=>{S.pd[key]=e.target.checked;save()}}));
};

// ---------- boot ----------
updateMeter();go();if(S.mock&&S.mock.endsAt)startTick();
</script>
